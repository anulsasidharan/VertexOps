# Cloud Build pipeline — builds and pushes API + Worker images, then deploys to Cloud Run.
#
# Trigger: push to `development` or tag `v*` via Cloud Build trigger config.
# Substitutions (set in Cloud Build trigger UI or gcloud CLI):
#   _REGION             — GCP region           (e.g. us-central1)
#   _GCP_PROJECT_ID     — GCP project ID
#   _ARTIFACT_REPO      — Artifact Registry repo name (e.g. vertexops)
#   _API_SERVICE        — Cloud Run service name for API  (default: vertexops-api)
#   _WORKER_SERVICE     — Cloud Run service name for worker (default: vertexops-worker)

substitutions:
  _REGION: us-central1
  _GCP_PROJECT_ID: ${PROJECT_ID}
  _ARTIFACT_REPO: vertexops
  _API_SERVICE: vertexops-api
  _WORKER_SERVICE: vertexops-worker

steps:
  # -------------------------------------------------------------------------
  # 1. Run unit tests before building images
  # -------------------------------------------------------------------------
  - name: python:3.11-slim
    id: unit-tests
    entrypoint: bash
    args:
      - -c
      - |
        pip install uv --quiet
        uv sync --all-groups --quiet
        uv run pytest tests/unit/ -q --tb=short
    env:
      - JWT_SECRET_KEY=ci-test-secret
      - API_KEY_PEPPER=ci-test-pepper

  # -------------------------------------------------------------------------
  # 2. Build API image
  # -------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - --target=api
      - --tag=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-api:$SHORT_SHA
      - --tag=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-api:latest
      - --cache-from=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-api:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .
    waitFor: [unit-tests]

  # -------------------------------------------------------------------------
  # 3. Build Worker image
  # -------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-worker
    args:
      - build
      - --target=worker
      - --tag=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-worker:$SHORT_SHA
      - --tag=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-worker:latest
      - --cache-from=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-worker:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .
    waitFor: [unit-tests]

  # -------------------------------------------------------------------------
  # 4. Push images (both in parallel)
  # -------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: push-api
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-api
    waitFor: [build-api]

  - name: gcr.io/cloud-builders/docker
    id: push-worker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-worker
    waitFor: [build-worker]

  # -------------------------------------------------------------------------
  # 5. Apply DB migrations via one-off Cloud Run job
  # -------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: run-migrations
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - vertexops-migrate
      - --region=$_REGION
      - --wait
      - --format=none
    waitFor: [push-api]

  # -------------------------------------------------------------------------
  # 6. Deploy API to Cloud Run
  # -------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_API_SERVICE
      - --image=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-api:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --no-traffic
    waitFor: [run-migrations]

  # -------------------------------------------------------------------------
  # 7. Shift traffic to new revision (100%)
  # -------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: shift-traffic
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - $_API_SERVICE
      - --region=$_REGION
      - --to-latest
    waitFor: [deploy-api]

  # -------------------------------------------------------------------------
  # 8. Deploy Worker
  # -------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_WORKER_SERVICE
      - --image=$_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-worker:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
    waitFor: [push-worker, run-migrations]

images:
  - $_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-api:$SHORT_SHA
  - $_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-api:latest
  - $_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-worker:$SHORT_SHA
  - $_REGION-docker.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/vertexops-worker:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
