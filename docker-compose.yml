# VertexOps — local development infrastructure
#
# Usage:
#   docker compose up -d --build            # start complete stack (frontend + api + postgres + redis)
#   docker compose run --rm api alembic upgrade head  # run migrations (first time)
#   docker compose up -d postgres redis     # backing services only
#   docker compose --profile worker up -d worker
#   docker compose logs -f api              # follow API logs
#   docker compose down -v                  # stop and remove volumes
#
# Connection URLs from the host machine (IDE / CLI):
#   DATABASE_URL  = postgresql+asyncpg://vertexops:vertexops@localhost:5432/vertexops
#   REDIS_URL     = redis://localhost:6379/0
#
# Connection URLs from inside containers (container-to-container):
#   DATABASE_URL  = postgresql+asyncpg://vertexops:vertexops@postgres:5432/vertexops
#   REDIS_URL     = redis://redis:6379/0

version: "3.9"

# ---------------------------------------------------------------------------
# Shared defaults applied to every service that needs app config
# ---------------------------------------------------------------------------
x-app-env: &app-env
  APP_ENV: development
  LOG_LEVEL: INFO
  DEBUG: "false"
  METRICS_ENABLED: "false"
  DATABASE_URL: postgresql+asyncpg://vertexops:vertexops@postgres:5432/vertexops
  REDIS_URL: redis://redis:6379/0
  REDIS_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # Development placeholders — override with real secrets in staging/prod
  JWT_SECRET_KEY: dev-jwt-secret-change-in-production
  API_KEY_PEPPER: dev-api-key-pepper-change-in-production
  ALLOW_PUBLIC_SIGNUP: "true"
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost"]'
  # LLM providers — read from .env file (never hardcode secrets here)
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # Vector store — read from .env file
  PINECONE_API_KEY: ${PINECONE_API_KEY:-}
  PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-vertexops-index}
  PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT:-}

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — metadata store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vertexops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vertexops
      POSTGRES_PASSWORD: vertexops
      POSTGRES_DB: vertexops
    ports:
      # Avoid publishing this port in production compose overlays.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertexops -d vertexops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vertexops_net

  # ---------------------------------------------------------------------------
  # Redis — Celery broker + rate-limit cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vertexops_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Avoid publishing this port in production compose overlays.
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vertexops_net

  # ---------------------------------------------------------------------------
  # API — FastAPI application (api target from Dockerfile)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: vertexops-api:latest
    container_name: vertexops_api
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - vertexops_net

  # ---------------------------------------------------------------------------
  # Frontend — React SPA served by Nginx; proxies /api → api:8000
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: vertexops-frontend:latest
    container_name: vertexops_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vertexops_net

  # ---------------------------------------------------------------------------
  # Worker — Celery background tasks (worker target from Dockerfile)
  # Start with: docker compose --profile worker up -d worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: vertexops-worker:latest
    container_name: vertexops_worker
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vertexops_net
    profiles:
      - worker

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Internal network
# ---------------------------------------------------------------------------
networks:
  vertexops_net:
    driver: bridge
