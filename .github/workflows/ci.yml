name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff (style + imports) and mypy (type checking)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dev dependencies
        run: uv sync --all-groups --quiet

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy backend/ --ignore-missing-imports
        continue-on-error: true   # non-blocking until type coverage improves

  # ---------------------------------------------------------------------------
  # Unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-jwt-secret-key-long-enough
      API_KEY_PEPPER: ci-test-api-key-pepper
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv sync --all-groups --quiet

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Integration tests (requires PostgreSQL + Redis)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vertexops
          POSTGRES_PASSWORD: vertexops
          POSTGRES_DB: vertexops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vertexops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://vertexops:vertexops@localhost:5432/vertexops
      REDIS_URL: redis://localhost:6379/0
      REDIS_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET_KEY: ci-integration-secret
      API_KEY_PEPPER: ci-integration-pepper
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv sync --all-groups --quiet

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Docker build validation (no push)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: vertexops-api:ci

      - name: Build Worker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: vertexops-worker:ci
